<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board | Task Manager</title>
    <link rel="icon" type="image/svg+xml" href="images/vite.webp" />
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Custom background styling to match the subtle gradient/tone of the image */
      body {
        background-color: #f3f4f8;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col justify-between font-sans antialiased text-gray-800"
  >
    <!-- Main Container -->
    <div class="w-full flex-grow flex flex-col">
      <!-- Navbar -->
      <header
        class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md sticky top-0 z-40"
      >
        <div
          class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-table-columns text-2xl"></i>
            <h1 class="text-xl font-bold tracking-tight">Kanban</h1>
          </div>
          <div class="flex items-center gap-2">
            <button
              class="w-10 h-10 rounded-lg bg-white/20 hover:bg-white/30 transition-colors flex items-center justify-center"
              id="add-task-btn"
              title="Create Task"
            >
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Content / Columns Area -->
      <main
        class="max-w-7xl w-full mx-auto p-6 md:p-8 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6 items-start"
      >
        <!-- Model overlay -->
        <div
          id="modal-overlay"
          class="fixed inset-0 bg-black/50 z-50 items-center justify-center p-4 flex hidden"
        >
          <!-- Modal Content -->
          <div
            id="task-modal"
            class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto transform transition-all"
          >
            <div
              class="flex items-center justify-between p-5 border-b border-slate-200"
            >
              <h2
                id="modal-title"
                class="text-lg font-semibold text-slate-800 flex items-center gap-2"
              >
                Create New Task
              </h2>
              <button
                id="close-modal-btn"
                class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors"
              >
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form id="task-form" class="p-5" novalidate="">
              <div class="mb-4">
                <label
                  for="task-title"
                  class="flex items-center gap-2 text-sm font-medium text-slate-700 mb-2"
                >
                  <i class="fa-solid fa-heading text-slate-400"></i>
                  Task Title <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  id="task-title"
                  name="title"
                  placeholder="What needs to be done?"
                  autocomplete="off"
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400"
                />
                <p
                  id="title-error"
                  class="text-red-500 text-xs mt-1 hidden"
                ></p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label
                    for="task-priority"
                    class="flex items-center gap-2 text-sm font-medium text-slate-700 mb-2"
                  >
                    <i class="fa-solid fa-flag text-slate-400"></i>
                    Priority
                  </label>
                  <select
                    id="task-priority"
                    name="priority"
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-white cursor-pointer"
                  >
                    <option value="low">Low</option>
                    <option value="medium" selected="">Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>

                <div>
                  <label
                    for="task-due-date"
                    class="flex items-center gap-2 text-sm font-medium text-slate-700 mb-2"
                  >
                    <i class="fa-regular fa-calendar text-slate-400"></i>
                    Due Date
                  </label>
                  <input
                    type="date"
                    id="task-due-date"
                    name="dueDate"
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                  />
                  <p
                    id="date-error"
                    class="text-red-500 text-xs mt-1 hidden"
                  ></p>
                </div>
              </div>

              <div class="mb-5">
                <label
                  for="task-description"
                  class="flex items-center gap-2 text-sm font-medium text-slate-700 mb-2"
                >
                  <i class="fa-solid fa-align-left text-slate-400"></i>
                  Description
                </label>
                <textarea
                  id="task-description"
                  name="description"
                  placeholder="Add more details about this task..."
                  rows="3"
                  maxlength="500"
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none placeholder:text-slate-400"
                ></textarea>
                <div class="flex justify-between items-center mt-1">
                  <p
                    id="description-error"
                    class="text-red-500 text-xs hidden"
                  ></p>
                  <p id="char-count" class="text-slate-400 text-xs ml-auto">
                    0/500
                  </p>
                </div>
              </div>

              <div class="flex gap-3">
                <button
                  type="button"
                  id="cancel-btn"
                  class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition-colors"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  id="submit-btn"
                  class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                >
                  <i class="fa-solid fa-plus"></i>
                  <span id="submit-btn-text">Add Task</span>
                </button>
              </div>
            </form>
          </div>
        </div>
        <!-- Column 1: To Do -->
        <div
          id="toDo1"
          class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 min-h-[500px] flex flex-col"
        >
          <!-- Column Header -->
          <div class="flex items-center space-x-3 space-x-reverse mb-6">
            <div
              class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500"
            >
              <i class="fa-regular fa-clipboard text-lg"></i>
            </div>
            <div>
              <h2 class="font-bold text-gray-800 text-base">To Do</h2>
              <p id="todo-count" class="text-xs text-gray-400 font-medium">
                0 tasks
              </p>
            </div>
          </div>

          <!-- Empty State -->
          <div
            id="emptyContainerTodo"
            class="flex-grow flex flex-col items-center justify-center text-gray-300 py-12"
          >
            <i class="fa-regular fa-folder-open text-6xl mb-3"></i>
            <p class="font-semibold text-gray-400 text-sm">No tasks yet</p>
            <p class="text-xs text-gray-300">Click + to add one</p>
          </div>
          <div id="TaskContainerTodo"></div>
        </div>

        <!-- Column 2: In Progress -->
        <div
          class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 min-h-[500px] flex flex-col"
        >
          <!-- Column Header -->
          <div class="flex items-center space-x-3 space-x-reverse mb-6">
            <div
              class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-500"
            >
              <i class="fa-solid fa-spinner text-lg"></i>
            </div>
            <div>
              <h2 class="font-bold text-gray-800 text-base">In Progress</h2>
              <p id="progress-count" class="text-xs text-gray-400 font-medium">
                0 tasks
              </p>
            </div>
          </div>
          <!-- Empty State -->
          <div
            id="emptyContainerProgress"
            class="flex-grow flex flex-col items-center justify-center text-gray-300 py-12"
          >
            <i class="fa-regular fa-folder-open text-6xl mb-3"></i>
            <p class="font-semibold text-gray-400 text-sm">No tasks yet</p>
            <p class="text-xs text-gray-300">Click + to add one</p>
          </div>

          <div id="TaskContainerProgress"></div>
        </div>

        <!-- Column 3: Completed -->
        <div
          class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 min-h-[500px] flex flex-col"
        >
          <!-- Column Header -->
          <div class="flex items-center space-x-3 space-x-reverse mb-6">
            <div
              class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-500"
            >
              <i class="fa-solid fa-circle-check text-lg"></i>
            </div>
            <div>
              <h2 class="font-bold text-gray-800 text-base">Completed</h2>
              <p id="completed-count" class="text-xs text-gray-400 font-medium">
                0 tasks
              </p>
            </div>
          </div>

          <!-- Empty State -->
          <div
            id="emptyContainerCompleted"
            class="flex-grow flex flex-col items-center justify-center text-gray-300 py-12"
          >
            <i class="fa-regular fa-folder-open text-6xl mb-3"></i>
            <p class="font-semibold text-gray-400 text-sm">No tasks yet</p>
            <p class="text-xs text-gray-300">Click + to add one</p>
          </div>

          <div id="TaskContainerCompleted"></div>
        </div>
      </main>
    </div>
    <!-- Footer -->
    <footer
      class="bg-[#0f172a] text-white text-xs py-4 text-center border-t border-slate-800"
    >
      <p class="text-gray-400">
        Made with <span class="text-red-500">❤️</span> by John
      </p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
